<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IJGB Earth Science Questionnaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#FFFFFF;--ink:#000000;--navy:#1F4E79;--mist:#EDF2F7;--line:#D3DDE8;--muted:#4A5563;--warn:#9B2C2C;
--air:#6E9CC4;--water:#1F4E79;--land:#8C6B45;--life:#2E7A5A;--ice:#A9CFDF;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0E1620;--ink:#F2F5F8;--navy:#8FB8DE;--mist:#18232F;--line:#2C3B4B;--muted:#A9B6C4;--warn:#F2A0A0;}}
:root[data-theme="dark"]{--paper:#0E1620;--ink:#F2F5F8;--navy:#8FB8DE;--mist:#18232F;--line:#2C3B4B;--muted:#A9B6C4;--warn:#F2A0A0;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Archivo",Arial,Helvetica,sans-serif;font-size:17px;line-height:1.55}
.wrap{max-width:680px;margin:0 auto;padding:28px 20px 64px}
header{display:flex;align-items:center;gap:14px;margin-bottom:28px}
header img{width:44px;height:auto}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) header img{filter:invert(1)}}
:root[data-theme="dark"] header img{filter:invert(1)}
header .t{font-weight:600;font-size:15px;color:var(--muted)}
.prog{margin-bottom:26px}
.prog .lbl{font-size:14px;color:var(--muted);margin-bottom:6px}
.bar{height:6px;background:var(--mist);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--navy);transition:width .3s}
h1{font-size:32px;line-height:1.15;margin:0 0 14px;font-weight:700;letter-spacing:-.01em}
h2{font-size:21px;margin:30px 0 10px;font-weight:700}
h3{font-size:17px;margin:22px 0 6px;font-weight:600}
p{margin:0 0 14px}
.muted{color:var(--muted)}
.q{margin:24px 0}
.q .qt{font-weight:600;margin-bottom:10px}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{font:inherit;font-size:16px;padding:10px 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;text-align:left}
.opt:hover{border-color:var(--navy)}
.opt[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--paper)}
.opt.col{display:block;width:100%}
.opt .sub{display:block;font-size:14px;opacity:.8;margin-top:2px}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
input[type=text],textarea{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
textarea{min-height:110px;resize:vertical}
label.f{display:block;font-weight:600;margin:20px 0 8px}
.hint{font-size:14px;color:var(--muted);margin-top:6px}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:36px}
.btn{font:inherit;font-weight:600;font-size:16px;padding:12px 22px;border-radius:10px;border:1.5px solid var(--navy);cursor:pointer}
.btn.pri{background:var(--navy);color:var(--paper)}
.btn.sec{background:transparent;color:var(--navy)}
.err{color:var(--warn);font-weight:600;margin-top:14px;min-height:1.2em}
/* the sphere sort */
.spheres{display:grid;gap:18px;margin-top:10px}
.sph{display:grid;grid-template-columns:92px 1fr;gap:16px;align-items:center;padding:14px;border:1.5px solid var(--line);border-radius:16px}
.orb{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:#fff;transition:transform .25s}
.orb.light{color:#0E1620}
.sph .hook{margin:0 0 10px;font-size:15.5px}
.rate{display:flex;gap:6px;flex-wrap:wrap}
.rate button{width:42px;height:42px;border-radius:50%;font:inherit;font-weight:600;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.rate button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.scale{font-size:13px;color:var(--muted);margin-top:4px}
.box{background:var(--mist);border-radius:14px;padding:18px 20px;margin:18px 0}
.terms dt{font-weight:600}
.terms dd{margin:0 0 10px}
.card{display:block;text-decoration:none;color:var(--ink);border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0}
.card:hover{border-color:var(--navy)}
.card .k{font-size:14px;color:var(--navy);font-weight:600}
.card .ti{font-weight:700;font-size:17px;margin:2px 0}
.card .by{font-size:14px;color:var(--muted)}
.tag{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:8px}
.check{display:flex;gap:10px;align-items:center;margin:8px 0;font-size:16px}
.check input{width:20px;height:20px}
.summary{white-space:pre-wrap;font-size:14.5px;background:var(--mist);border-radius:12px;padding:16px;max-height:340px;overflow:auto}
.status{margin-top:12px;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.linkbtn{background:none;border:none;padding:0;font:inherit;color:var(--navy);text-decoration:underline;cursor:pointer}
.reset{margin-top:48px;font-size:14px}
.reset button{background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit;padding:0}
@media (max-width:520px){h1{font-size:27px}.sph{grid-template-columns:1fr}.orb{width:64px;height:64px;font-size:14px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

      ["Bedrock", "Solid rock under soil or ice."],
      ["Subglacial", "Under a glacier or ice sheet."],
      ["Calving", "When large pieces of ice break off a glacier into the sea."],
    ],
    why: "Scientists mapped 1,943 valleys under Greenland's ice, and about a third are new. Ice flows fastest through valleys, so their location helps predict how the ice sheet will change as it retreats.",
    watch: "Melting ice on land raises sea level. Melting sea ice does not, because it already floats. This video and article are about land ice. The article also says groundwater likely helped carve these valleys, which links to Land.",
    q: { how: "How did these valleys form before the ice covered them?", measure: "How can scientists map land under more than a mile of ice that no one has ever seen?", do: "Why would a coastal city care about valleys under Greenland?" },
  },
};
const app = document.getElementById("app");
let st = load();

function blank() {
  return { step: "welcome", name: "", learn: {}, ratings: {}, picks: [], connect: "", lens: {}, refl: {}, final: "", finalWhy: "", submitted: false };
}
function load() {
  try { const v = localStorage.getItem(STORE_KEY); if (v) return Object.assign(blank(), JSON.parse(v)); } catch (e) {}
  return blank();
}
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(st)); } catch (e) {} }
function esc(s) { return String(s || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

// ---- top-two logic ----
function ranked() { return ORDER.slice().sort((a, b) => (st.ratings[b] || 0) - (st.ratings[a] || 0)); }
function tieInfo() {
  const r = ranked(), second = st.ratings[r[1]];
  const locked = ORDER.filter(k => st.ratings[k] > second);
  const tied = ORDER.filter(k => st.ratings[k] === second);
  return { locked, tied, need: 2 - locked.length, isTie: locked.length + tied.length > 2 };
}
function topTwo() { return st.picks.length === 2 ? st.picks : ranked().slice(0, 2); }

// ---- step sequence ----
function steps() {
  const s = ["welcome", "learn", "sort"];
  if (Object.keys(st.ratings).length === 5 && tieInfo().isTie) s.push("tie");
  s.push("connect", "lens", "read0", "refl0", "read1", "refl1", "final", "done");
  return s;
}
function go(dir) {
  const s = steps(), i = s.indexOf(st.step);
  st.step = s[Math.max(0, Math.min(s.length - 1, i + dir))];
  save(); render(); window.scrollTo(0, 0);
}
function err(msg) { document.getElementById("err").textContent = msg; }

function progress() {
  const s = steps(), i = s.indexOf(st.step);
  return `<div class="prog"><div class="lbl">Step ${i + 1} of ${s.length}</div><div class="bar"><i style="width:${Math.round((i + 1) / s.length * 100)}%"></i></div></div>`;
}
function nav(backOk = true, nextLabel = "Continue") {
  return `<div class="err" id="err" role="alert"></div><div class="nav">${backOk ? `<button class="btn sec" data-act="back">Back</button>` : "<span></span>"}<button class="btn pri" data-act="next">${nextLabel}</button></div>`;
}
function optBtns(group, options, current, col) {
  return `<div class="opts">${options.map(o => {
    const val = typeof o === "string" ? o : o.id, lbl = typeof o === "string" ? o : o.name, sub = typeof o === "string" ? "" : (o.sub ? `<span class="sub">${esc(o.sub)}</span>` : "");
    return `<button type="button" class="opt${col ? " col" : ""}" data-group="${group}" data-val="${esc(val)}" aria-pressed="${current === val}">${esc(lbl)}${sub}</button>`;
  }).join("")}</div>`;
}
function dot(k) { return `<span class="tag" style="background:${S[k].color}"></span>`; }

// ---- screens ----
const V = {
  welcome() {
    return `<h1>Find your Earth Science focus</h1>
<p>This questionnaire helps us choose your research topic. It also helps me understand how you learn, so I can give you better instructions.</p>
<p>There are no wrong answers. You will rate five areas of Earth Science, pick two, then watch a short video and read one article for each.</p>
<p class="muted">Plan for about 2 hours. Your progress saves on this device, so you can stop and come back. Log this time on ADP.</p>
<label class="f" for="name">Your first name</label><input type="text" id="name" value="${esc(st.name)}" autocomplete="given-name">
${nav(false, "Start")}`;
  },
  learn() {
    return `<h1>How you learn</h1><p>Pick the answer that fits you best.</p>
${LEARN.map(L => `<div class="q"><div class="qt">${esc(L.q)}</div>${optBtns("learn:" + L.id, L.o, st.learn[L.id])}</div>`).join("")}${nav()}`;
  },
  sort() {
    return `<h1>Rate each area</h1><p>Read each headline. How much do you want to learn about this area?</p><p class="scale">1 = not interested &nbsp;&nbsp; 5 = very interested</p>
<div class="spheres">${ORDER.map(k => {
      const r = st.ratings[k] || 0, sc = 0.8 + r * 0.05;
      return `<div class="sph"><div class="orb${S[k].light ? " light" : ""}" style="background:${S[k].color};transform:scale(${sc})">${S[k].name}</div>
<div><p class="hook">${esc(S[k].hook)}</p><div class="rate" role="group" aria-label="Rate ${S[k].name}">${[1, 2, 3, 4, 5].map(n => `<button type="button" data-rate="${k}" data-val="${n}" aria-pressed="${r === n}">${n}</button>`).join("")}</div></div></div>`;
    }).join("")}</div>${nav()}`;
  },
  tie() {
    const t = tieInfo();
    const lockedTxt = t.locked.length ? `<p>${dot(t.locked[0])}<strong>${S[t.locked[0]].name}</strong> is already in your top two.</p>` : "";
    return `<h1>Break the tie</h1>${lockedTxt}<p>These areas tied. Pick ${t.need === 1 ? "the one" : "the two"} you would rather explain to a friend.</p>
${optBtns("tie", t.tied.map(k => ({ id: k, name: S[k].name, sub: S[k].hook })), null, true)}${nav()}`;
  },
  connect() {
    const a = topTwo()[0];
    return `<h1>Make a connection</h1><p>Real problems usually sit where two areas meet. Which other area connects most to ${dot(a)}<strong>${S[a].name}</strong>?</p>
${optBtns("connect", ORDER.filter(k => k !== a).map(k => ({ id: k, name: S[k].name })), st.connect)}${nav()}`;
  },
  lens() {
    return `<h1>Choose your lens</h1><p>Every topic can be studied three ways. For each of your top two areas, pick the question that interests you most.</p>
${topTwo().map(k => `<div class="q"><div class="qt">${dot(k)}${S[k].name}</div>${optBtns("lens:" + k, LENSES, st.lens[k], true)}</div>`).join("")}${nav()}`;
  },
  read(i) {
    const k = topTwo()[i], d = S[k], lensId = st.lens[k], lens = LENSES.find(l => l.id === lensId);
    const videoFirst = st.learn.learn_first !== "Reading about it";
    const vid = `<a class="card" href="${d.video.url}" target="_blank" rel="noopener"><div class="k">Watch</div><div class="ti">${esc(d.video.title)}</div><div class="by">${esc(d.video.by)}</div>${d.video.note ? `<div class="hint">${esc(d.video.note)}</div>` : ""}</a>${d.video.extra ? `<a class="card" href="${d.video.extra}" target="_blank" rel="noopener"><div class="k">Optional</div><div class="ti">Video 5: What Can We Do About HABs?</div><div class="by">YouTube</div></a>` : ""}`;
    const art = `<a class="card" href="${d.article.url}" target="_blank" rel="noopener"><div class="k">Read</div><div class="ti">${esc(d.article.title)}</div><div class="by">${esc(d.article.by)}</div>${d.article.note ? `<div class="hint">${esc(d.article.note)}</div>` : ""}</a>`;
    return `<h1>${dot(k)}${d.name}</h1><p class="muted">Area ${i + 1} of 2. Read this primer first. It takes two minutes.</p>
<div class="box"><h3 style="margin-top:0">Your question while you ${videoFirst ? "watch and read" : "read and watch"}</h3><p style="margin:0"><strong>${esc(lens.name)}:</strong> ${esc(d.q[lensId])}</p></div>
<h2>Key terms</h2><dl class="terms">${d.terms.map(([t, x]) => `<dt>${esc(t)}</dt><dd>${esc(x)}</dd>`).join("")}</dl>
<h2>Why it matters</h2><p>${esc(d.why)}</p>
<h2>Watch out</h2><p>${esc(d.watch)}</p>
<h2>${videoFirst ? "Watch, then read" : "Read, then watch"}</h2>${videoFirst ? vid + art : art + vid}
<p class="hint">Links open in a new tab. Come back here when you finish.</p>${nav(true, "I finished both")}`;
  },
  refl(i) {
    const k = topTwo()[i], r = st.refl[k] || {};
    return `<h1>${dot(k)}${S[k].name}: your take</h1><p>Write in your own words. Do not copy from the article.</p>
<div class="check"><input type="checkbox" id="watched" ${r.watched ? "checked" : ""}><label for="watched">I watched the video</label></div>
<div class="check"><input type="checkbox" id="read" ${r.read ? "checked" : ""}><label for="read">I read the article</label></div>
<label class="f" for="summary">Summarize what you learned in three sentences.</label><textarea id="summary">${esc(r.summary)}</textarea>
<label class="f" for="surprise">What surprised you?</label><textarea id="surprise" style="min-height:80px">${esc(r.surprise)}</textarea>
<label class="f" for="question">What is one question you would ask the scientists?</label><textarea id="question" style="min-height:80px">${esc(r.question)}</textarea>
<label class="f" for="answer">Your answer to your lens question</label><div class="hint" style="margin-top:-4px;margin-bottom:8px">${esc(S[k].q[st.lens[k]])}</div><textarea id="answer" style="min-height:80px">${esc(r.answer)}</textarea>
${nav()}`;
  },
  final() {
    const [a, b] = topTwo();
    return `<h1>Your choice</h1><p>Which area do you want to research for the rest of the fall?</p>
${optBtns("final", [{ id: a, name: S[a].name }, { id: b, name: S[b].name }, { id: "field", name: "None of these fit", sub: "I am more drawn to fieldwork or lab work" }], st.final, true)}
<label class="f" for="why">Why? Two or three sentences.</label><textarea id="why">${esc(st.finalWhy)}</textarea>${nav(true, "Review my answers")}`;
  },
  done() {
    const txt = plain();
    const copyRow = `<div class="row"><button class="btn sec" data-act="copy">Copy my answers</button><button class="btn sec" data-act="download">Download</button>${BETTER_EMAIL ? `<button class="btn sec" data-act="email">Email</button>` : ""}</div>`;
    if (st.submitted) {
      return `<h1>Answers sent</h1><p>Your answers went to Better. You are done with this questionnaire. Log your time on ADP.</p>
<div class="summary" id="sum">${esc(txt)}</div>
<p class="hint" style="margin-top:14px">Want a copy for yourself? <button class="linkbtn" data-act="copy">Copy</button> or <button class="linkbtn" data-act="download">download</button> your answers.</p>
<div class="status" id="status" role="status"></div>`;
    }
    return `<h1>Review and submit</h1><p>Check your answers. When they look right, submit them.</p>
<div class="summary" id="sum">${esc(txt)}</div>
<div class="row"><button class="btn pri" data-act="submit">Submit my answers</button></div>
<div class="status" id="status" role="status"></div>
${sendFailed ? `<p style="margin-top:18px">Your answers did not send. Check your internet connection and try Submit again. If it still fails, copy or download your answers and send them to Better.</p>${copyRow}` : ""}
<div class="nav"><button class="btn sec" data-act="back">Back</button><span></span></div>`;
  },
};

// ---- output ----
function record() {
  const [a, b] = topTwo(), ra = st.refl[a] || {}, rb = st.refl[b] || {};
  const nm = k => k === "field" ? "Fieldwork or lab work" : (S[k] ? S[k].name : "");
  const ln = k => (LENSES.find(l => l.id === st.lens[k]) || {}).name || "";
  return {
    code: SUBMIT_CODE, submitted_at: new Date().toISOString(), name: st.name,
    learn_first: st.learn.learn_first || "", learn_stuck: st.learn.learn_stuck || "", learn_instr: st.learn.learn_instr || "", learn_focus: st.learn.learn_focus || "",
    rate_air: st.ratings.air || "", rate_water: st.ratings.water || "", rate_land: st.ratings.land || "", rate_life: st.ratings.life || "", rate_ice: st.ratings.ice || "",
    top1: nm(a), top2: nm(b), connect: nm(st.connect), lens1: ln(a), lens2: ln(b),
    watched1: ra.watched ? "Yes" : "No", read1: ra.read ? "Yes" : "No", summary1: ra.summary || "", surprise1: ra.surprise || "", question1: ra.question || "", answer1: ra.answer || "",
    watched2: rb.watched ? "Yes" : "No", read2: rb.read ? "Yes" : "No", summary2: rb.summary || "", surprise2: rb.surprise || "", question2: rb.question || "", answer2: rb.answer || "",
    final_choice: nm(st.final), final_why: st.finalWhy,
  };
}
function plain() {
  const r = record();
  return `IJGB Earth Science Questionnaire
Name: ${r.name}

HOW YOU LEARN
Learning something new: ${r.learn_first}
When stuck: ${r.learn_stuck}
Instructions: ${r.learn_instr}
Best focus time: ${r.learn_focus}

RATINGS (1 to 5)
Air ${r.rate_air}, Water ${r.rate_water}, Land ${r.rate_land}, Life ${r.rate_life}, Ice ${r.rate_ice}
Top two: ${r.top1}, ${r.top2}
Connects ${r.top1} to: ${r.connect}

${r.top1.toUpperCase()} (lens: ${r.lens1})
Watched video: ${r.watched1}. Read article: ${r.read1}.
Summary: ${r.summary1}
Surprise: ${r.surprise1}
Question for scientists: ${r.question1}
Lens answer: ${r.answer1}

${r.top2.toUpperCase()} (lens: ${r.lens2})
Watched video: ${r.watched2}. Read article: ${r.read2}.
Summary: ${r.summary2}
Surprise: ${r.surprise2}
Question for scientists: ${r.question2}
Lens answer: ${r.answer2}

FINAL CHOICE: ${r.final_choice}
Why: ${r.final_why}`;
}
function status(msg) { const el = document.getElementById("status"); if (el) el.textContent = msg; }

let sendFailed = false;
async function submit() {
  if (!SHEET_URL) { sendFailed = true; render(); status("The sheet link is not set up yet."); return; }
  const btn = document.querySelector('[data-act="submit"]'); if (btn) { btn.disabled = true; btn.textContent = "Sending..."; }
  try {
    await fetch(SHEET_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(record()) });
    st.submitted = true; sendFailed = false; save(); render(); window.scrollTo(0, 0);
  } catch (e) { sendFailed = true; render(); status("Sending failed."); }
}

// ---- events ----
function collect() {
  if (st.step === "welcome") st.name = document.getElementById("name").value.trim();
  if (st.step === "refl0" || st.step === "refl1") {
    const k = topTwo()[st.step === "refl0" ? 0 : 1];
    st.refl[k] = { watched: document.getElementById("watched").checked, read: document.getElementById("read").checked,
      summary: document.getElementById("summary").value.trim(), surprise: document.getElementById("surprise").value.trim(),
      question: document.getElementById("question").value.trim(), answer: document.getElementById("answer").value.trim() };
  }
  if (st.step === "final") st.finalWhy = document.getElementById("why").value.trim();
  save();
}
function valid() {
  const s = st.step;
  if (s === "welcome" && !st.name) return "Enter your first name.";
  if (s === "learn" && LEARN.some(L => !st.learn[L.id])) return "Answer all four questions.";
  if (s === "sort" && Object.keys(st.ratings).length < 5) return "Rate all five areas.";
  if (s === "tie" && st.picks.length !== 2) return "Pick " + (tieInfo().need === 1 ? "one area." : "two areas.");
  if (s === "connect" && !st.connect) return "Pick one area.";
  if (s === "lens" && topTwo().some(k => !st.lens[k])) return "Pick a lens for both areas.";
  if (s === "refl0" || s === "refl1") {
    const r = st.refl[topTwo()[s === "refl0" ? 0 : 1]];
    if (!r.summary || !r.surprise || !r.question || !r.answer) return "Answer all four questions.";
  }
  if (s === "final" && (!st.final || !st.finalWhy)) return "Pick one option and explain why.";
  return "";
}

app.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.rate) {
    st.ratings[t.dataset.rate] = +t.dataset.val; st.picks = []; st.connect = ""; st.lens = {}; save(); render(); return;
  }
  if (t.dataset.group) {
    const [g, id] = t.dataset.group.split(":"), v = t.dataset.val;
    if (g === "learn") st.learn[id] = v;
    if (g === "connect") st.connect = v;
    if (g === "lens") st.lens[id] = v;
    if (g === "final") { st.finalWhy = (document.getElementById("why") || {}).value || st.finalWhy; st.final = v; }
    if (g === "tie") {
      const ti = tieInfo(); let chosen = st.picks.filter(k => ti.tied.includes(k));
      chosen = chosen.includes(v) ? chosen.filter(k => k !== v) : chosen.concat(v).slice(-ti.need);
      st.picks = chosen.length === ti.need ? ti.locked.concat(chosen) : chosen;
      save(); render();
      document.querySelectorAll('[data-group="tie"]').forEach(b => b.setAttribute("aria-pressed", chosen.includes(b.dataset.val)));
      return;
    }
    if (g === "connect" || g === "lens") { /* no reset */ }
    save(); render(); return;
  }
  const act = t.dataset.act;
  if (act === "back") { collect(); go(-1); }
  if (act === "next") { collect(); const m = valid(); if (m) { err(m); return; } if (st.step === "sort" && !tieInfo().isTie) st.picks = []; go(1); }
  if (act === "submit") submit();
  if (act === "copy") {
    const txt = plain();
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => status("Copied. Paste it into a message to Better."))
      .catch(() => { const r = document.createRange(); r.selectNodeContents(document.getElementById("sum")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); status("Press Ctrl+C or Cmd+C to copy the selected text."); });
  }
  if (act === "download") {
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([plain()], { type: "text/plain" }));
    a.download = `earth-science-answers-${(st.name || "intern").toLowerCase()}.txt`; document.body.appendChild(a); a.click(); a.remove();
    status("Downloaded. If nothing happened, use Copy instead.");
  }
  if (act === "email") location.href = `mailto:${BETTER_EMAIL}?subject=${encodeURIComponent("Earth Science questionnaire: " + st.name)}&body=${encodeURIComponent(plain())}`;
});
document.getElementById("resetBtn").addEventListener("click", () => {
  if (confirm("Start over? This clears your answers on this device.")) { st = blank(); save(); render(); }
});

function render() {
  let h;
  if (st.step === "read0") h = V.read(0); else if (st.step === "read1") h = V.read(1);
  else if (st.step === "refl0") h = V.refl(0); else if (st.step === "refl1") h = V.refl(1);
  else h = V[st.step]();
  app.innerHTML = progress() + h;
  if (st.step === "tie") { const ti = tieInfo(); document.querySelectorAll('[data-group="tie"]').forEach(b => b.setAttribute("aria-pressed", st.picks.includes(b.dataset.val) && ti.tied.includes(b.dataset.val))); }
}
render();
</script></body></html>
